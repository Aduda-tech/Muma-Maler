name: Build Android (APK + signed AAB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Artifacts
    runs-on: ubuntu-latest

    # GITHUB_TOKEN needs write access to publish a GitHub Release.
    permissions:
      contents: write

    # Secrets are not accessible inside `if:` conditionals, so expose them as
    # environment variables at the job level and test those instead.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      # ---- Release signing (only when secrets are configured) ----
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Write keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # ---- Builds ----
      - name: Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Compile Signed Release APK (sideload / alternative stores)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Compile Signed Release AAB
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cd android
          ./gradlew bundleRelease

      # ---- Uploads ----
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muma-maler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release APK (sideload / alternative stores)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: muma-maler-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB (Play Store)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: muma-maler-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ---- Publish GitHub Release (download page) ----
      - name: Prepare release assets
        id: assets
        run: |
          ASSETS="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            ASSETS="$ASSETS,android/app/build/outputs/apk/release/app-release.apk"
          fi
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            ASSETS="$ASSETS,android/app/build/outputs/bundle/release/app-release.aab"
          fi
          echo "assets=$ASSETS" >> "$GITHUB_OUTPUT"

      - name: Publish / update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          tag: v1.0.0
          name: "Muma Maler v1.0.0"
          artifacts: ${{ steps.assets.outputs.assets }}
          token: ${{ secrets.GITHUB_TOKEN }}
